<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#233c33"/><stop offset="1" stop-color="#38584b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0d1713" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1176" cy="96" r="174" fill="#bce3d0" opacity=".12"/>
  <text x="72" y="92" fill="#bce3d0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3">VIDEO NOTES · 02</text>
  <text x="72" y="153" fill="#fffaf0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="800">每条标记都带着字幕上下文</text>
  <text x="72" y="195" fill="#c9d8d0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20">5、10、20、30 秒四档可选，原生字幕与双语字幕都能继续编辑。</text>
  <g transform="translate(122 245)" filter="url(#shadow)">
    <rect width="1036" height="450" rx="28" fill="#f7f4ed"/>
    <g transform="translate(44 42)">
      <text x="0" y="20" fill="#38584b" font-family="ui-monospace, monospace" font-size="16" font-weight="800">00:19:57</text>
      <rect x="828" y="0" width="110" height="34" rx="17" fill="#dff5e8"/>
      <text x="883" y="22" fill="#38584b" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">编辑字幕</text>
      <text x="0" y="72" fill="#17231f" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">关键思路从这个约束开始，后续推导都依赖它。</text>
      <rect x="0" y="108" width="948" height="204" rx="20" fill="#fffcf6" stroke="#d9ddd5"/>
      <text x="25" y="143" fill="#38584b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="800">前置字幕 · 20 秒</text>
      <text x="25" y="185" fill="#17231f" font-family="Segoe UI, sans-serif" font-size="19" font-weight="650">The useful idea starts from this constraint.</text>
      <text x="25" y="222" fill="#45534c" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19">关键思路从这个约束开始。</text>
      <line x1="25" y1="251" x2="923" y2="251" stroke="#e3e3dc"/>
      <text x="25" y="284" fill="#617068" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">字幕内容可以独立修订，导出时与笔记正文一起保留。</text>
      <g transform="translate(0 337)">
        <rect width="123" height="39" rx="19.5" fill="#233c33"/>
        <text x="61" y="26" fill="#fffaf0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">启用前置字幕</text>
        <text x="155" y="25" fill="#617068" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">时长</text>
        <rect x="198" width="58" height="39" rx="12" fill="#f2d989"/>
        <text x="227" y="25" fill="#17231f" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800">20s</text>
        <rect x="266" width="58" height="39" rx="12" fill="#ebe9e1"/>
        <text x="295" y="25" fill="#617068" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14">30s</text>
      </g>
    </g>
  </g>
</svg>
